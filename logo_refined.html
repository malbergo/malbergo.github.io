<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refined — Nature & Computation Lab</title>
    <style>
        :root {
            --bg: #fafafa;
            --text: #0a0a0a;
            --accent: #da532c;
        }

        [data-theme="dark"] {
            --bg: #0a0a0a;
            --text: #f5f5f5;
            --accent: #ff6b3d;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'IBM Plex Mono', monospace;
            transition: background 0.3s;
        }

        .container {
            text-align: center;
            max-width: 1400px;
            padding: 2rem;
        }

        .logo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 4rem;
            margin: 3rem 0;
        }

        .logo-option {
            padding: 2rem;
            transition: all 0.3s;
        }

        .logo-option:hover {
            transform: translateY(-2px);
        }

        .logo-option h3 {
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1.5rem;
            opacity: 0.7;
            font-weight: 400;
        }

        svg {
            display: block;
            margin: 0 auto;
        }

        .theme-btn {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: var(--bg);
            border: 2px solid var(--text);
            color: var(--text);
            padding: 0.5rem 1rem;
            font-family: 'IBM Plex Mono', monospace;
            cursor: pointer;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.2s;
            z-index: 100;
        }

        .theme-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg);
        }

        h1 {
            font-size: 0.7rem;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: var(--text);
            opacity: 0.5;
            margin-bottom: 0.5rem;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <button class="theme-btn" onclick="toggleTheme()">Toggle</button>

    <div class="container">
        <h1>Nature & Computation Lab</h1>

        <div class="logo-grid">
            <!-- Option 1: Clean Vertical -->
            <div class="logo-option">
                <h3>01 / Clean Vertical</h3>
                <svg width="220" height="180" viewBox="0 0 220 180">
                    <!-- nature -->
                    <text x="110" y="45"
                          font-family="IBM Plex Mono, monospace"
                          font-size="18"
                          font-weight="300"
                          fill="var(--text)"
                          text-anchor="middle"
                          letter-spacing="3"
                          opacity="0.7">nature</text>

                    <!-- Clean S-curve -->
                    <path d="M 110,55 Q 95,75 95,95 Q 95,115 110,125"
                          fill="none"
                          stroke="var(--accent)"
                          stroke-width="2"
                          opacity="0.7"/>

                    <!-- Transition points -->
                    <circle cx="95" cy="95" r="2.5" fill="var(--accent)" opacity="0.6"/>

                    <!-- computation -->
                    <text x="110" y="150"
                          font-family="IBM Plex Mono, monospace"
                          font-size="14"
                          font-weight="700"
                          fill="var(--text)"
                          text-anchor="middle"
                          letter-spacing="2"
                          opacity="0.85">computation</text>
                </svg>
            </div>

            <!-- Option 2: Ampersand Flow -->
            <div class="logo-option">
                <h3>02 / Ampersand</h3>
                <svg width="240" height="140" viewBox="0 0 240 140">
                    <!-- nature -->
                    <text x="50" y="45"
                          font-family="IBM Plex Mono, monospace"
                          font-size="16"
                          font-weight="300"
                          fill="var(--text)"
                          letter-spacing="2.5"
                          opacity="0.7">nature</text>

                    <!-- & symbol with flow -->
                    <text x="120" y="75"
                          font-family="IBM Plex Mono, monospace"
                          font-size="28"
                          font-weight="400"
                          fill="var(--accent)"
                          text-anchor="middle"
                          opacity="0.75">&</text>

                    <!-- computation -->
                    <text x="120" y="115"
                          font-family="IBM Plex Mono, monospace"
                          font-size="13"
                          font-weight="700"
                          fill="var(--text)"
                          text-anchor="middle"
                          letter-spacing="2"
                          opacity="0.85">computation</text>
                </svg>
            </div>

            <!-- Option 3: Stacked with Line -->
            <div class="logo-option">
                <h3>03 / Divided</h3>
                <svg width="220" height="140" viewBox="0 0 220 140">
                    <!-- nature -->
                    <text x="110" y="40"
                          font-family="IBM Plex Mono, monospace"
                          font-size="17"
                          font-weight="300"
                          fill="var(--text)"
                          text-anchor="middle"
                          letter-spacing="3"
                          opacity="0.7">nature</text>

                    <!-- Dividing line with flow -->
                    <line x1="60" y1="70" x2="160" y2="70"
                          stroke="var(--text)"
                          stroke-width="0.5"
                          opacity="0.4"/>

                    <!-- Flow through line -->
                    <path d="M 90,70 Q 100,80 110,70"
                          fill="none"
                          stroke="var(--accent)"
                          stroke-width="1.5"
                          opacity="0.6"/>

                    <!-- computation -->
                    <text x="110" y="105"
                          font-family="IBM Plex Mono, monospace"
                          font-size="13"
                          font-weight="700"
                          fill="var(--text)"
                          text-anchor="middle"
                          letter-spacing="2"
                          opacity="0.85">computation</text>
                </svg>
            </div>

            <!-- Option 4: Minimal with Symbol -->
            <div class="logo-option">
                <h3>04 / Symbol Between</h3>
                <svg width="200" height="150" viewBox="0 0 200 150">
                    <!-- nature -->
                    <text x="100" y="40"
                          font-family="IBM Plex Mono, monospace"
                          font-size="16"
                          font-weight="300"
                          fill="var(--text)"
                          text-anchor="middle"
                          letter-spacing="2.5"
                          opacity="0.7">nature</text>

                    <!-- ∩ symbol -->
                    <text x="100" y="82"
                          font-family="IBM Plex Mono, monospace"
                          font-size="18"
                          font-weight="400"
                          fill="var(--accent)"
                          text-anchor="middle"
                          opacity="0.7">∩</text>

                    <!-- computation -->
                    <text x="100" y="115"
                          font-family="IBM Plex Mono, monospace"
                          font-size="13"
                          font-weight="700"
                          fill="var(--text)"
                          text-anchor="middle"
                          letter-spacing="2"
                          opacity="0.85">computation</text>
                </svg>
            </div>

            <!-- Option 5: Tight Stack -->
            <div class="logo-option">
                <h3>05 / Tight Stack</h3>
                <svg width="200" height="120" viewBox="0 0 200 120">
                    <!-- nature -->
                    <text x="100" y="35"
                          font-family="IBM Plex Mono, monospace"
                          font-size="15"
                          font-weight="300"
                          fill="var(--text)"
                          text-anchor="middle"
                          letter-spacing="2.5"
                          opacity="0.65">nature</text>

                    <!-- Small flow accent -->
                    <circle cx="100" cy="50" r="2" fill="var(--accent)" opacity="0.6"/>
                    <line x1="100" y1="52" x2="100" y2="60"
                          stroke="var(--accent)"
                          stroke-width="1"
                          opacity="0.5"/>

                    <!-- computation -->
                    <text x="100" y="85"
                          font-family="IBM Plex Mono, monospace"
                          font-size="13"
                          font-weight="700"
                          fill="var(--text)"
                          text-anchor="middle"
                          letter-spacing="2"
                          opacity="0.85">computation</text>
                </svg>
            </div>

            <!-- Option 6: Side by Side -->
            <div class="logo-option">
                <h3>06 / Side by Side</h3>
                <svg width="280" height="100" viewBox="0 0 280 100">
                    <!-- nature -->
                    <text x="70" y="55"
                          font-family="IBM Plex Mono, monospace"
                          font-size="16"
                          font-weight="300"
                          fill="var(--text)"
                          text-anchor="end"
                          letter-spacing="2.5"
                          opacity="0.7">nature</text>

                    <!-- Flow connector -->
                    <path d="M 80,50 Q 100,50 120,50"
                          fill="none"
                          stroke="var(--accent)"
                          stroke-width="1.5"
                          opacity="0.6"/>

                    <circle cx="100" cy="50" r="2.5" fill="var(--accent)" opacity="0.7"/>

                    <!-- computation -->
                    <text x="130" y="55"
                          font-family="IBM Plex Mono, monospace"
                          font-size="13"
                          font-weight="700"
                          fill="var(--text)"
                          letter-spacing="2"
                          opacity="0.85">computation</text>
                </svg>
            </div>

            <!-- Option 7: Diagonal Minimal -->
            <div class="logo-option">
                <h3>07 / Diagonal</h3>
                <svg width="240" height="140" viewBox="0 0 240 140">
                    <!-- nature (top left) -->
                    <text x="60" y="40"
                          font-family="IBM Plex Mono, monospace"
                          font-size="15"
                          font-weight="300"
                          fill="var(--text)"
                          letter-spacing="2.5"
                          opacity="0.65">nature</text>

                    <!-- Diagonal flow -->
                    <path d="M 105,35 Q 125,55 145,75"
                          fill="none"
                          stroke="var(--accent)"
                          stroke-width="2"
                          opacity="0.6"/>

                    <circle cx="125" cy="55" r="2.5" fill="var(--accent)" opacity="0.7"/>

                    <!-- computation (bottom right) -->
                    <text x="120" y="110"
                          font-family="IBM Plex Mono, monospace"
                          font-size="13"
                          font-weight="700"
                          fill="var(--text)"
                          letter-spacing="2"
                          opacity="0.85">computation</text>
                </svg>
            </div>

            <!-- Option 8: Breathing Space -->
            <div class="logo-option">
                <h3>08 / Breathing</h3>
                <svg width="200" height="160" viewBox="0 0 200 160">
                    <!-- nature -->
                    <text x="100" y="40"
                          font-family="IBM Plex Mono, monospace"
                          font-size="16"
                          font-weight="300"
                          fill="var(--text)"
                          text-anchor="middle"
                          letter-spacing="3"
                          opacity="0.65">nature</text>

                    <!-- Breathing ripples -->
                    <circle cx="100" cy="80" r="8"
                            fill="none"
                            stroke="var(--accent)"
                            stroke-width="1"
                            opacity="0.6"/>

                    <circle cx="100" cy="80" r="15"
                            fill="none"
                            stroke="var(--accent)"
                            stroke-width="0.5"
                            opacity="0.4"/>

                    <!-- computation -->
                    <text x="100" y="125"
                          font-family="IBM Plex Mono, monospace"
                          font-size="13"
                          font-weight="700"
                          fill="var(--text)"
                          text-anchor="middle"
                          letter-spacing="2"
                          opacity="0.85">computation</text>
                </svg>
            </div>

            <!-- Option 9: Lab Mark -->
            <div class="logo-option">
                <h3>09 / Lab Mark</h3>
                <svg width="240" height="160" viewBox="0 0 240 160">
                    <!-- nature & computation -->
                    <text x="120" y="60"
                          font-family="IBM Plex Mono, monospace"
                          font-size="15"
                          font-weight="300"
                          fill="var(--text)"
                          text-anchor="middle"
                          letter-spacing="2"
                          opacity="0.7">nature &</text>

                    <text x="120" y="85"
                          font-family="IBM Plex Mono, monospace"
                          font-size="15"
                          font-weight="300"
                          fill="var(--text)"
                          text-anchor="middle"
                          letter-spacing="2"
                          opacity="0.7">computation</text>

                    <!-- "lab" below -->
                    <text x="120" y="120"
                          font-family="IBM Plex Mono, monospace"
                          font-size="11"
                          font-weight="700"
                          fill="var(--accent)"
                          text-anchor="middle"
                          letter-spacing="3"
                          opacity="0.7">lab</text>
                </svg>
            </div>

            <!-- Option 10: Centered Intersection -->
            <div class="logo-option">
                <h3>10 / Centered</h3>
                <svg width="200" height="150" viewBox="0 0 200 150">
                    <!-- nature -->
                    <text x="100" y="38"
                          font-family="IBM Plex Mono, monospace"
                          font-size="14"
                          font-weight="300"
                          fill="var(--text)"
                          text-anchor="middle"
                          letter-spacing="2.5"
                          opacity="0.65">nature</text>

                    <!-- Center mark -->
                    <line x1="85" y1="75" x2="115" y2="75"
                          stroke="var(--text)"
                          stroke-width="0.5"
                          opacity="0.3"/>

                    <circle cx="100" cy="75" r="4"
                            fill="none"
                            stroke="var(--accent)"
                            stroke-width="1"
                            opacity="0.7"/>

                    <!-- computation -->
                    <text x="100" y="115"
                          font-family="IBM Plex Mono, monospace"
                          font-size="12"
                          font-weight="700"
                          fill="var(--text)"
                          text-anchor="middle"
                          letter-spacing="2"
                          opacity="0.85">computation</text>
                </svg>
            </div>

            <!-- Option 11: Minimal Mono -->
            <div class="logo-option">
                <h3>11 / Mono</h3>
                <svg width="180" height="120" viewBox="0 0 180 120">
                    <!-- nature -->
                    <text x="90" y="40"
                          font-family="IBM Plex Mono, monospace"
                          font-size="13"
                          font-weight="400"
                          fill="var(--text)"
                          text-anchor="middle"
                          letter-spacing="2"
                          opacity="0.65">nature</text>

                    <!-- Single dot -->
                    <circle cx="90" cy="60" r="2" fill="var(--accent)" opacity="0.7"/>

                    <!-- computation -->
                    <text x="90" y="85"
                          font-family="IBM Plex Mono, monospace"
                          font-size="11"
                          font-weight="700"
                          fill="var(--text)"
                          text-anchor="middle"
                          letter-spacing="2"
                          opacity="0.85">computation</text>
                </svg>
            </div>

            <!-- Option 12: Slash Division -->
            <div class="logo-option">
                <h3>12 / Slash</h3>
                <svg width="240" height="120" viewBox="0 0 240 120">
                    <!-- nature -->
                    <text x="95" y="50"
                          font-family="IBM Plex Mono, monospace"
                          font-size="14"
                          font-weight="300"
                          fill="var(--text)"
                          text-anchor="end"
                          letter-spacing="2.5"
                          opacity="0.7">nature</text>

                    <!-- Slash -->
                    <line x1="105" y1="30" x2="115" y2="65"
                          stroke="var(--accent)"
                          stroke-width="1.5"
                          opacity="0.6"/>

                    <!-- computation -->
                    <text x="125" y="70"
                          font-family="IBM Plex Mono, monospace"
                          font-size="12"
                          font-weight="700"
                          fill="var(--text)"
                          letter-spacing="2"
                          opacity="0.85">computation</text>
                </svg>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }

        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</body>
</html>
