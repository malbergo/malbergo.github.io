<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Background Molecules</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent;
        }

        canvas {
            display: block;
            background-color: transparent;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>
    <script>
        // Molecular system configuration for background
        const numMolecules = 10;
        const numAtoms = 5; // Atoms per molecule
        let molecules = [];

        // Temperature - gentle oscillation
        let t = 0;
        let baseTemp = 0.2;
        let tempAmplitude = 0.3;

        function setup() {
            createCanvas(windowWidth, windowHeight, P2D);
            pixelDensity(2);

            // Initialize molecules spread across the screen
            for (let i = 0; i < numMolecules; i++) {
                molecules.push(new Molecule());
            }
        }

        function draw() {
            clear();

            // Gentle oscillating temperature
            t += 0.003;
            let temperature = baseTemp + tempAmplitude * (0.5 + 0.5 * sin(t));

            // Update and draw all molecules
            for (let mol of molecules) {
                mol.update(temperature);
                mol.display();
            }
        }

        class Molecule {
            constructor() {
                // Random position across full screen
                this.centerX = random(width * 0.1, width * 0.9);
                this.centerY = random(height * 0.1, height * 0.9);

                // Gentle drift velocity
                this.vx = random(-0.3, 0.3);
                this.vy = random(-0.3, 0.3);

                // Atoms in the molecule
                this.atoms = [];

                // Arrange atoms in a ring around center
                for (let i = 0; i < numAtoms; i++) {
                    let angle = (TWO_PI / numAtoms) * i;
                    let radius = random(15, 25);

                    this.atoms.push({
                        // Equilibrium position relative to center
                        eqX: cos(angle) * radius,
                        eqY: sin(angle) * radius,
                        // Current displacement from equilibrium
                        x: 0,
                        y: 0,
                        // Velocity
                        vx: 0,
                        vy: 0,
                        // Visual properties
                        size: random(3, 5),
                        mass: random(0.8, 1.2)
                    });
                }

                // Color for this molecule - colorful palette
                let colorChoice = random(1);
                if (colorChoice < 0.25) {
                    this.col = color(218, 83, 44, 120); // Orange accent
                } else if (colorChoice < 0.4) {
                    this.col = color(60, 80, 100, 120); // Blue-grey
                } else if (colorChoice < 0.55) {
                    this.col = color(70, 100, 120, 120); // Medium blue
                } else if (colorChoice < 0.7) {
                    this.col = color(80, 120, 140, 120); // Light blue
                } else if (colorChoice < 0.85) {
                    this.col = color(50, 70, 80, 120); // Teal
                } else {
                    this.col = color(10, 10, 10, 100); // Dark
                }

                // Random initial rotation for variety
                this.rotation = random(TWO_PI);
                this.rotationSpeed = random(-0.002, 0.002);
            }

            update(temperature) {
                // Gentle drift with screen wrap
                this.centerX += this.vx;
                this.centerY += this.vy;

                // Wrap around screen edges
                if (this.centerX < -50) this.centerX = width + 50;
                if (this.centerX > width + 50) this.centerX = -50;
                if (this.centerY < -50) this.centerY = height + 50;
                if (this.centerY > height + 50) this.centerY = -50;

                // Gentle rotation
                this.rotation += this.rotationSpeed;

                // Langevin dynamics for each atom
                for (let atom of this.atoms) {
                    // Spring force pulling back to equilibrium
                    let springK = 0.04;
                    let fx = -springK * atom.x;
                    let fy = -springK * atom.y;

                    // Damping
                    let damping = 0.96;

                    // Thermal noise (Brownian motion)
                    let noiseStrength = sqrt(temperature) * 0.1;
                    let noiseX = randomGaussian(0, noiseStrength);
                    let noiseY = randomGaussian(0, noiseStrength);

                    // Update velocity
                    atom.vx = (atom.vx + fx) * damping + noiseX;
                    atom.vy = (atom.vy + fy) * damping + noiseY;

                    // Update position
                    atom.x += atom.vx;
                    atom.y += atom.vy;
                }
            }

            display() {
                push();
                translate(this.centerX, this.centerY);
                rotate(this.rotation);

                // Draw bonds between atoms
                stroke(this.col);
                strokeWeight(0.8);
                for (let i = 0; i < this.atoms.length; i++) {
                    let a1 = this.atoms[i];
                    let a2 = this.atoms[(i + 1) % this.atoms.length];

                    let x1 = a1.eqX + a1.x;
                    let y1 = a1.eqY + a1.y;
                    let x2 = a2.eqX + a2.x;
                    let y2 = a2.eqY + a2.y;

                    line(x1, y1, x2, y2);
                }

                // Draw atoms
                noStroke();
                fill(this.col);
                for (let atom of this.atoms) {
                    let x = atom.eqX + atom.x;
                    let y = atom.eqY + atom.y;
                    ellipse(x, y, atom.size, atom.size);
                }

                // Draw center point (subtle)
                fill(this.col.levels[0], this.col.levels[1], this.col.levels[2], 60);
                ellipse(0, 0, 2, 2);

                pop();
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
