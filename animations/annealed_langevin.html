<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Molecular Equilibrium</title>
    <style>
        :root {
            --text: #0a0a0a;
            --accent: #da532c;
            --particle-dark: rgba(10, 10, 10, 180);
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent;
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            color: var(--text);
        }

        /* Listen for theme changes from parent */
        body.dark-theme {
            --text: #f5f5f5;
            --particle-dark: rgba(245, 245, 245, 180);
        }

        canvas {
            display: block;
            background-color: transparent;
            cursor: crosshair;
        }

        #temp-label {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            letter-spacing: 0.05em;
            opacity: 0.5;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>

    <div id="temp-label">
        T = <span id="temp-val">1.0</span>
    </div>

    <script>
        // Listen for theme changes from parent window
        window.addEventListener('message', function(event) {
            if (event.data.type === 'theme') {
                if (event.data.theme === 'dark') {
                    document.body.classList.add('dark-theme');
                } else {
                    document.body.classList.remove('dark-theme');
                }
                // Update molecule colors
                updateColorsForTheme();
            }
        });

        // Check parent theme on load
        if (window.parent !== window) {
            try {
                const parentTheme = window.parent.document.documentElement.getAttribute('data-theme');
                if (parentTheme === 'dark') {
                    document.body.classList.add('dark-theme');
                }
            } catch (e) {
                // Cross-origin restrictions, ignore
            }
        }

        // Molecular system configuration
        const numMolecules = 12;
        const numAtoms = 5; // Atoms per molecule
        let molecules = [];

        // Temperature oscillates
        let t = 0;
        let baseTemp = 0.3;
        let tempAmplitude = 0.7;

        function setup() {
            createCanvas(windowWidth, windowHeight, P2D);
            pixelDensity(2);

            // Initialize molecules
            for (let i = 0; i < numMolecules; i++) {
                molecules.push(new Molecule());
            }
        }

        function updateColorsForTheme() {
            let isDark = document.body.classList.contains('dark-theme');
            for (let mol of molecules) {
                // Only update non-accent colors
                if (mol.col.levels[0] !== 218) { // Not the orange accent
                    mol.col = isDark ? color(245, 245, 245, 180) : color(10, 10, 10, 180);
                }
            }
        }

        function mouseOut() {
            // Reset mouse position when leaving canvas
            mouseX = -1;
            mouseY = -1;
        }

        function draw() {
            clear();

            // Oscillating temperature
            t += 0.004;
            let temperature = baseTemp + tempAmplitude * (0.5 + 0.5 * sin(t));

            // Update UI
            document.getElementById('temp-val').innerText = temperature.toFixed(2);

            // Draw mouse influence area (only when hovering)
            if (mouseX > 10 && mouseY > 10 && mouseX < width - 10 && mouseY < height - 10) {
                noFill();
                stroke(218, 83, 44, 50);
                strokeWeight(1);
                ellipse(mouseX, mouseY, 200, 200);
            }

            // Update and draw all molecules
            for (let mol of molecules) {
                mol.update(temperature);
                mol.display();
            }
        }

        class Molecule {
            constructor() {
                // Central position of molecule
                this.centerX = random(width * 0.15, width * 0.85);
                this.centerY = random(height * 0.2, height * 0.8);

                // Atoms in the molecule
                this.atoms = [];

                // Arrange atoms in a ring around center
                for (let i = 0; i < numAtoms; i++) {
                    let angle = (TWO_PI / numAtoms) * i;
                    let radius = random(25, 35);

                    this.atoms.push({
                        // Equilibrium position relative to center
                        eqX: cos(angle) * radius,
                        eqY: sin(angle) * radius,
                        // Current displacement from equilibrium
                        x: 0,
                        y: 0,
                        // Velocity
                        vx: 0,
                        vy: 0,
                        // Visual properties
                        size: random(4, 7),
                        mass: random(0.8, 1.2)
                    });
                }

                // Color for this molecule
                if (random(1) < 0.25) {
                    this.col = color(218, 83, 44, 200); // Accent
                } else {
                    // Use theme-aware color
                    let isDark = document.body.classList.contains('dark-theme');
                    this.col = isDark ? color(245, 245, 245, 180) : color(10, 10, 10, 180);
                }
            }

            update(temperature) {
                // Mouse interaction - repulsive force
                let mouseDist = dist(mouseX, mouseY, this.centerX, this.centerY);
                let mouseForce = createVector(0, 0);

                if (mouseDist < 200 && mouseX > 0 && mouseY > 0) {
                    // Repulsive force from mouse
                    mouseForce = createVector(
                        this.centerX - mouseX,
                        this.centerY - mouseY
                    );
                    mouseForce.setMag(map(mouseDist, 0, 200, 5.0, 0));
                }

                // Langevin dynamics for each atom
                for (let atom of this.atoms) {
                    // Spring force pulling back to equilibrium
                    let springK = 0.05;
                    let fx = -springK * atom.x;
                    let fy = -springK * atom.y;

                    // Add mouse repulsion (stronger effect)
                    fx += mouseForce.x * 0.08;
                    fy += mouseForce.y * 0.08;

                    // Damping
                    let damping = 0.95;

                    // Thermal noise (Brownian motion)
                    let noiseStrength = sqrt(temperature) * 0.15;
                    let noiseX = randomGaussian(0, noiseStrength);
                    let noiseY = randomGaussian(0, noiseStrength);

                    // Update velocity
                    atom.vx = (atom.vx + fx) * damping + noiseX;
                    atom.vy = (atom.vy + fy) * damping + noiseY;

                    // Update position
                    atom.x += atom.vx;
                    atom.y += atom.vy;
                }
            }

            display() {
                push();
                translate(this.centerX, this.centerY);

                // Draw bonds between atoms
                stroke(this.col);
                strokeWeight(1);
                for (let i = 0; i < this.atoms.length; i++) {
                    let a1 = this.atoms[i];
                    let a2 = this.atoms[(i + 1) % this.atoms.length];

                    let x1 = a1.eqX + a1.x;
                    let y1 = a1.eqY + a1.y;
                    let x2 = a2.eqX + a2.x;
                    let y2 = a2.eqY + a2.y;

                    line(x1, y1, x2, y2);
                }

                // Draw atoms
                noStroke();
                fill(this.col);
                for (let atom of this.atoms) {
                    let x = atom.eqX + atom.x;
                    let y = atom.eqY + atom.y;
                    ellipse(x, y, atom.size, atom.size);
                }

                // Draw center point (subtle)
                fill(this.col.levels[0], this.col.levels[1], this.col.levels[2], 100);
                ellipse(0, 0, 3, 3);

                pop();
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
