<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ANNEALED_LANGEVIN_DYNAMICS // SYSTEM_02</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            mix-blend-mode: exclusion;
            padding: 20px;
            box-sizing: border-box;
            color: #ff0055;
            z-index: 10;
        }
        .hero-text {
            font-weight: 900;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 0.9;
            border-left: 10px solid #ff0055;
            padding-left: 15px;
        }
        .data-block {
            position: absolute;
            bottom: 40px;
            right: 40px;
            text-align: right;
            font-size: 0.8rem;
            line-height: 1.4;
        }
        .temp-bar {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 200px;
            height: 20px;
            border: 2px solid #ff0055;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .temp-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0055, #00ff41);
            transition: width 0.1s linear;
        }
        .scanline {
            width: 100%;
            height: 80px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255, 0, 85, 0.03) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.15;
            position: absolute;
            bottom: 100%;
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }
        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -80px; }
        }
        .blinking { animation: blink 1.2s infinite; }
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="hero-text">
            ANNEALED<br>
            LANGEVIN<br>
            DYNAMICS
        </div>
        <div class="data-block">
            TEMPERATURE: <span id="temp-val">2.00</span><br>
            PHASE: <span id="phase-val">EXPLORATION</span><br>
            STATUS: <span class="blinking">SAMPLING</span><br>
            -∇U + √(2T)ξ
        </div>
        <div class="temp-bar">
            <div class="temp-fill" id="temp-fill" style="width: 100%;"></div>
        </div>
    </div>
    <div class="scanline"></div>

    <script>
        let particles = [];
        const numParticles = 800;
        let temperature = 2.0;
        const minTemp = 0.05;
        const maxTemp = 2.0;
        let gridGraphics;

        // Energy landscape: 3-mode Gaussian Mixture
        const modes = [
            { x: 0.25, y: 0.3, sigma: 0.12 },
            { x: 0.75, y: 0.35, sigma: 0.15 },
            { x: 0.5, y: 0.7, sigma: 0.10 }
        ];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            background(5);

            // Initialize particles randomly
            for(let i = 0; i < numParticles; i++) {
                particles.push({
                    x: random(1),
                    y: random(1),
                    vx: 0,
                    vy: 0
                });
            }

            // Create grid
            gridGraphics = createGraphics(windowWidth, windowHeight);
            drawGrid(gridGraphics);
        }

        function draw() {
            // Fade effect for trails
            noStroke();
            fill(5, 5, 5, 25);
            rect(0, 0, width, height);

            // Draw grid
            image(gridGraphics, 0, 0);

            // Anneal temperature (slow cool down)
            temperature = maxTemp * (1 - (frameCount % 600) / 600);
            temperature = max(temperature, minTemp);

            // Update UI
            document.getElementById('temp-val').innerText = temperature.toFixed(2);
            document.getElementById('temp-fill').style.width = (temperature / maxTemp * 100) + '%';

            let phase = temperature > 1.2 ? 'EXPLORATION' :
                        temperature > 0.3 ? 'ANNEALING' : 'CONVERGENCE';
            document.getElementById('phase-val').innerText = phase;

            // Draw energy wells (modes) as glowing circles
            drawModes();

            // Update particles via Langevin dynamics
            for(let p of particles) {
                // Compute energy gradient at particle position
                let grad = computeGradient(p.x, p.y);

                // Langevin update: dx = -∇U * dt + √(2T*dt) * noise
                let dt = 0.01;
                let noiseScale = sqrt(2 * temperature * dt);

                p.x += -grad.x * dt + randomGaussian(0, noiseScale);
                p.y += -grad.y * dt + randomGaussian(0, noiseScale);

                // Boundary reflection
                if(p.x < 0.05) p.x = 0.05;
                if(p.x > 0.95) p.x = 0.95;
                if(p.y < 0.05) p.y = 0.05;
                if(p.y > 0.95) p.y = 0.95;

                // Draw particle with chromatic aberration
                // Color shifts from hot (red) to cold (blue) as temp decreases
                let px = p.x * width;
                let py = p.y * height;

                // Hot color (red/magenta)
                let hotR = map(temperature, minTemp, maxTemp, 100, 255);
                let hotG = map(temperature, minTemp, maxTemp, 200, 0);
                let hotB = map(temperature, minTemp, maxTemp, 255, 100);

                stroke(hotR, hotG, hotB, 180);
                strokeWeight(2);
                point(px, py);

                // Cold color offset (cyan)
                stroke(0, 200, 255, 120);
                strokeWeight(1.5);
                point(px - 1.5, py - 1.5);
            }

            // Glitch effects
            if(frameCount % 90 === 0) {
                fill(255, 0, 85, 15);
                noStroke();
                rect(random(width), random(height), random(150, 400), random(5, 30));
            }
        }

        function computeGradient(x, y) {
            // Gradient of negative log probability (energy)
            let gx = 0;
            let gy = 0;
            let totalWeight = 0;

            for(let mode of modes) {
                let dx = x - mode.x;
                let dy = y - mode.y;
                let distSq = dx*dx + dy*dy;
                let sigmaSq = mode.sigma * mode.sigma;
                let weight = exp(-distSq / (2 * sigmaSq));

                gx -= weight * dx / sigmaSq;
                gy -= weight * dy / sigmaSq;
                totalWeight += weight;
            }

            if(totalWeight > 1e-10) {
                gx *= temperature / totalWeight;
                gy *= temperature / totalWeight;
            }

            return { x: gx, y: gy };
        }

        function drawModes() {
            // Draw the energy landscape modes as pulsing circles
            for(let mode of modes) {
                let mx = mode.x * width;
                let my = mode.y * height;
                let radius = mode.sigma * width;

                // Outer glow
                noFill();
                stroke(0, 255, 100, 30);
                strokeWeight(2);
                ellipse(mx, my, radius * 2.5);

                // Core
                fill(0, 255, 100, 10);
                noStroke();
                ellipse(mx, my, radius * 1.5);

                // Pulsing ring
                let pulse = sin(frameCount * 0.03 + mode.x * 10) * 0.2 + 1;
                noFill();
                stroke(0, 255, 100, 60);
                strokeWeight(1);
                ellipse(mx, my, radius * 2 * pulse);
            }
        }

        function drawGrid(g) {
            g.stroke(255, 255, 255, 10);
            g.strokeWeight(1);
            let step = 60;
            for(let x = 0; x < width; x += step) {
                g.line(x, 0, x, height);
            }
            for(let y = 0; y < height; y += step) {
                g.line(0, y, width, y);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            gridGraphics = createGraphics(windowWidth, windowHeight);
            drawGrid(gridGraphics);
            background(5);
        }
    </script>
</body>
</html>
