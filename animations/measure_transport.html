<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DYNAMICAL_MEASURE_TRANSPORT // SYSTEM_01</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        /* Brutalist UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            mix-blend-mode: exclusion;
            padding: 20px;
            box-sizing: border-box;
            color: #00ff41;
            z-index: 10;
        }
        .hero-text {
            font-weight: 900;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 0.9;
            border-left: 10px solid #00ff41;
            padding-left: 15px;
        }
        .data-block {
            position: absolute;
            bottom: 40px;
            right: 40px;
            text-align: right;
            font-size: 0.8rem;
            line-height: 1.4;
        }
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255, 255, 255, 0.02) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }
        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }
        .blinking { animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="hero-text">
            DYNAMICAL<br>
            MEASURE<br>
            TRANSPORT
        </div>
        <div class="data-block">
            FLOW_FIELD: <span id="noise-val">PERLIN</span><br>
            PARTICLES: <span id="p-count">2000</span><br>
            STATUS: <span class="blinking">OPTIMIZING</span><br>
            μ(dx) / dt
        </div>
    </div>
    <div class="scanline"></div>

    <script>
        let particles = [];
        const numParticles = 2500;
        const noiseScale = 0.01; // Controls chaos level
        let gridGraphics; // For the retro grid

        function setup() {
            createCanvas(windowWidth, windowHeight);
            background(5); // Almost black

            // Initialize particles
            for(let i = 0; i < numParticles; i ++) {
                particles.push(createVector(random(width), random(height)));
            }

            // Create a static grid graphic to save performance
            gridGraphics = createGraphics(windowWidth, windowHeight);
            drawGrid(gridGraphics);
        }

        function draw() {
            // 1. THE FADE EFFECT
            // We draw a semi-transparent background every frame to create trails
            noStroke();
            fill(5, 5, 5, 20); // The 4th value (alpha) controls trail length
            rect(0, 0, width, height);

            // 2. DRAW THE RETRO GRID
            image(gridGraphics, 0, 0);

            // 3. UPDATE AND DRAW PARTICLES (The Transport)
            // We simulate two "colors" slightly offset to create chromatic aberration

            for(let i = 0; i < numParticles; i++) {
                let p = particles[i];

                // Get the vector field value at this coordinate (The Map T)
                // We use 3D noise (x, y, time) so the field changes slowly over time
                let n = noise(p.x * noiseScale, p.y * noiseScale, frameCount * 0.002);

                // Map noise to an angle (0 to 2*PI)
                // We quantize the angle slightly to give it a "robotic/brutalist" feel
                let a = n * TWO_PI * 2;

                // Convert angle to vector
                p.x += cos(a) * 2; // Velocity X
                p.y += sin(a) * 2; // Velocity Y

                // Edge Wrapping (The Torus topology)
                if(!onScreen(p)) {
                    p.x = random(width);
                    p.y = random(height);
                }

                // RENDER
                // We draw the particle twice with a slight offset for RGB split effect

                // Cyan Channel
                stroke(0, 255, 255, 150);
                strokeWeight(1.5);
                point(p.x, p.y);

                // Magenta Channel (lagging slightly behind visually)
                stroke(255, 0, 85, 150);
                strokeWeight(1.5);
                point(p.x - 2, p.y - 2);
            }

            // 4. ADD RANDOM GLITCH BLOCKS
            if (frameCount % 60 === 0) {
                fill(0, 255, 65, 20);
                noStroke();
                let rx = random(width);
                let ry = random(height);
                let rw = random(100, 300);
                let rh = random(10, 50);
                rect(rx, ry, rw, rh);
            }
        }

        function onScreen(v) {
            return v.x >= 0 && v.x <= width && v.y >= 0 && v.y <= height;
        }

        function drawGrid(g) {
            g.stroke(255, 255, 255, 15); // Very faint white
            g.strokeWeight(1);
            let step = 50;
            for (let x = 0; x < width; x += step) {
                g.line(x, 0, x, height);
            }
            for (let y = 0; y < height; y += step) {
                g.line(0, y, width, y);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            gridGraphics = createGraphics(windowWidth, windowHeight);
            drawGrid(gridGraphics);
            background(5);
        }
    </script>
</body>
</html>
