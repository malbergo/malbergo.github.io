<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Continuous vs Discrete Transport</title>
    <style>
        :root {
            --text: #0a0a0a;
            --accent: #da532c;
            --particle-dark: rgba(10, 10, 10, 120);
            --particle-light: rgba(245, 245, 245, 120);
            --divider: rgba(10, 10, 10, 40);
            --grid-outline: rgba(10, 10, 10, 30);
            --mask-fill: rgba(40, 40, 45, 120);
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent;
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            color: var(--text);
        }

        /* Listen for theme changes from parent */
        body.dark-theme {
            --text: #f5f5f5;
            --particle-dark: rgba(245, 245, 245, 120);
            --particle-light: rgba(10, 10, 10, 120);
            --divider: rgba(245, 245, 245, 40);
            --grid-outline: rgba(245, 245, 245, 30);
            --mask-fill: rgba(220, 220, 225, 120);
        }

        canvas {
            display: block;
            background-color: transparent;
        }

        #label-container {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            opacity: 0.6;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>

    <div id="label-container">
        <div>continuous</div>
        <div>discrete</div>
    </div>

    <script>
        // Listen for theme changes from parent window
        window.addEventListener('message', function(event) {
            if (event.data.type === 'theme') {
                if (event.data.theme === 'dark') {
                    document.body.classList.add('dark-theme');
                } else {
                    document.body.classList.remove('dark-theme');
                }
                // Regenerate GMMs with new colors
                updateColorsForTheme();
            }
        });

        // Check parent theme on load
        if (window.parent !== window) {
            try {
                const parentTheme = window.parent.document.documentElement.getAttribute('data-theme');
                if (parentTheme === 'dark') {
                    document.body.classList.add('dark-theme');
                }
            } catch (e) {
                // Cross-origin restrictions, ignore
            }
        }

        // --- CONFIGURATION ---
        const numParticles = 3000;
        const sigma = 60;

        // Continuous side
        const numComp0 = 6;
        const numComp1 = 6;
        let particles = [];
        let gmm0, gmm1;

        // Discrete side - CTMC on lattice
        const N = 64; // Sequence length (8x8 grid)
        const D = 5;  // Number of token types (states)
        const EMPTY = -1;
        const MASK = 0;
        let sequence = [];
        let targetSequence = [];
        let insertionTimes = [];
        let unmaskingTimes = [];

        let t = 0;
        let direction = 1;
        let isPaused = false;
        let pauseTimer = 0;

        function setup() {
            createCanvas(windowWidth, windowHeight, P2D);
            pixelDensity(2);

            // Left side: continuous GMM
            let leftWidth = width * 0.42;
            gmm0 = generateRandomGMM(numComp0, leftWidth * 0.1, leftWidth * 0.4);
            gmm1 = generateRandomGMM(numComp1, leftWidth * 0.6, leftWidth * 0.9);

            for (let i = 0; i < numParticles; i++) {
                particles.push(new ContinuousParticle());
            }

            // Right side: discrete sequence
            initializeSequence();
        }

        function updateColorsForTheme() {
            // Update GMM colors
            let isDark = document.body.classList.contains('dark-theme');
            for (let gmm of [gmm0, gmm1]) {
                for (let comp of gmm) {
                    // Only update non-accent colors
                    if (comp.col.levels[0] !== 218) { // Not the orange accent
                        comp.col = isDark ? color(245, 245, 245, 120) : color(10, 10, 10, 120);
                    }
                }
            }

            // Update particle colors
            for (let particle of particles) {
                // Find matching component color
                if (particle.col.levels[0] !== 218) { // Not the orange accent
                    particle.col = isDark ? color(245, 245, 245, 120) : color(10, 10, 10, 120);
                }
            }
        }

        function draw() {
            clear();

            // Time logic
            if (!isPaused) {
                t += direction * 0.006;
                if (t >= 1) { t = 1; direction = -1; pause(30); }
                else if (t <= 0) {
                    t = 0;
                    direction = 1;
                    particles.forEach(p => p.resample());
                    initializeSequence();
                    pause(20);
                }
            } else {
                if (frameCount > pauseTimer) isPaused = false;
            }

            // Draw divider line
            let isDark = document.body.classList.contains('dark-theme');
            stroke(isDark ? 245 : 10, isDark ? 245 : 10, isDark ? 245 : 10, 40);
            strokeWeight(2);
            line(width/2, 0, width/2, height);

            // LEFT: Continuous stochastic interpolant
            drawContinuous();

            // RIGHT: Discrete CTMC
            drawDiscrete();
        }

        function pause(frames) {
            isPaused = true;
            pauseTimer = frameCount + frames;
        }

        // ============= CONTINUOUS SIDE =============

        function generateRandomGMM(count, minX, maxX) {
            let components = [];
            let totalWeight = 0;

            for(let i=0; i<count; i++) {
                let mx = random(minX, maxX);
                let my = random(height * 0.2, height * 0.8);

                let sd1 = random(15, 40);
                let sd2 = random(8, 25);
                let theta = random(TWO_PI);

                let w = random(0.3, 1.0);
                totalWeight += w;

                let col;
                if (random(1) < 0.2) {
                    col = color(218, 83, 44, 140);
                } else {
                    // Use theme-aware color
                    let isDark = document.body.classList.contains('dark-theme');
                    col = isDark ? color(245, 245, 245, 120) : color(10, 10, 10, 120);
                }

                components.push({
                    mean: createVector(mx, my),
                    sd: createVector(sd1, sd2),
                    angle: theta,
                    weight: w,
                    col: col
                });
            }

            components.forEach(c => c.weight /= totalWeight);

            let acc = 0;
            for(let c of components) {
                acc += c.weight;
                c.cdf = acc;
            }

            return components;
        }

        class ContinuousParticle {
            constructor() {
                this.resample();
            }

            resample() {
                let c0 = this.sampleComponent(gmm0);
                this.x0 = this.sampleGaussianVector(c0);

                let c1 = this.sampleComponent(gmm1);
                this.x1 = this.sampleGaussianVector(c1);

                this.z = createVector(randomGaussian(0, 1), randomGaussian(0, 1));
                this.col = c1.col;
            }

            sampleComponent(gmm) {
                let r = random(1);
                for (let c of gmm) {
                    if (r < c.cdf) return c;
                }
                return gmm[gmm.length - 1];
            }

            sampleGaussianVector(comp) {
                let u1 = randomGaussian(0, 1);
                let u2 = randomGaussian(0, 1);

                let x = u1 * comp.sd.x;
                let y = u2 * comp.sd.y;

                let rx = x * cos(comp.angle) - y * sin(comp.angle);
                let ry = x * sin(comp.angle) + y * cos(comp.angle);

                return createVector(rx + comp.mean.x, ry + comp.mean.y);
            }

            render(time) {
                let alpha = 1 - time;
                let beta = time;
                let gamma = sigma * Math.sqrt(time * (1 - time));

                let px = alpha*this.x0.x + beta*this.x1.x + gamma*this.z.x;
                let py = alpha*this.x0.y + beta*this.x1.y + gamma*this.z.y;

                stroke(this.col);
                point(px, py);
            }
        }

        function drawContinuous() {
            // Draw contour plots of GMMs
            drawGMMContours(gmm0, 0.15);  // Initial distribution (more transparent)
            drawGMMContours(gmm1, 0.15);  // Terminal distribution (more transparent)

            // Draw particles on top
            strokeWeight(1.5);
            for (let p of particles) {
                p.render(t);
            }
        }

        function drawGMMContours(gmm, alpha) {
            // Draw composite contour lines for the entire GMM
            let leftWidth = width * 0.42;
            let gridResolution = 40; // Grid resolution for density evaluation

            push();
            noFill();

            // Create a 2D grid to evaluate density
            let xMin = 0;
            let xMax = leftWidth;
            let yMin = 0;
            let yMax = height;

            let dx = leftWidth / gridResolution;
            let dy = height / gridResolution;

            // Compute density at each grid point
            let densityGrid = [];
            let maxDensity = 0;

            for (let i = 0; i <= gridResolution; i++) {
                densityGrid[i] = [];
                for (let j = 0; j <= gridResolution; j++) {
                    let x = xMin + i * dx;
                    let y = yMin + j * dy;

                    // Sum density contributions from all GMM components
                    let density = 0;
                    for (let comp of gmm) {
                        density += comp.weight * evaluateGaussian(x, y, comp);
                    }

                    densityGrid[i][j] = density;
                    maxDensity = max(maxDensity, density);
                }
            }

            // Draw contour lines at different density levels
            let contourLevels = [0.1, 0.3, 0.6]; // Relative to max density

            for (let levelIdx = 0; levelIdx < contourLevels.length; levelIdx++) {
                let level = contourLevels[levelIdx] * maxDensity;
                let opacity = alpha * (3 - levelIdx) * 35;

                // Determine color based on dominant component at this level
                let avgColor = getAverageGMMColor(gmm);
                stroke(avgColor.r, avgColor.g, avgColor.b, opacity);
                strokeWeight(1.5);

                // March through grid and draw contour segments
                for (let i = 0; i < gridResolution; i++) {
                    for (let j = 0; j < gridResolution; j++) {
                        let x = xMin + i * dx;
                        let y = yMin + j * dy;

                        // Check if contour passes through this cell
                        let d00 = densityGrid[i][j];
                        let d10 = densityGrid[i+1][j];
                        let d01 = densityGrid[i][j+1];
                        let d11 = densityGrid[i+1][j+1];

                        // Simple marching squares - draw segments where level crosses
                        drawContourSegment(x, y, dx, dy, d00, d10, d01, d11, level);
                    }
                }
            }

            pop();
        }

        function evaluateGaussian(x, y, comp) {
            // Evaluate Gaussian density at (x,y) for component comp
            let dx = x - comp.mean.x;
            let dy = y - comp.mean.y;

            // Rotate to align with principal axes
            let cos_a = cos(-comp.angle);
            let sin_a = sin(-comp.angle);
            let rx = dx * cos_a - dy * sin_a;
            let ry = dx * sin_a + dy * cos_a;

            // Normalized by standard deviations
            let zx = rx / comp.sd.x;
            let zy = ry / comp.sd.y;

            // Gaussian formula (unnormalized is fine for contours)
            return exp(-0.5 * (zx*zx + zy*zy));
        }

        function getAverageGMMColor(gmm) {
            // Get weighted average color of GMM components
            let r = 0, g = 0, b = 0;
            for (let comp of gmm) {
                r += comp.col.levels[0] * comp.weight;
                g += comp.col.levels[1] * comp.weight;
                b += comp.col.levels[2] * comp.weight;
            }
            return {r: r, g: g, b: b};
        }

        function drawContourSegment(x, y, dx, dy, d00, d10, d01, d11, level) {
            // Simple marching squares implementation
            let points = [];

            // Check each edge of the cell
            if ((d00 < level && d10 >= level) || (d00 >= level && d10 < level)) {
                let t = (level - d00) / (d10 - d00);
                points.push({x: x + t * dx, y: y});
            }
            if ((d10 < level && d11 >= level) || (d10 >= level && d11 < level)) {
                let t = (level - d10) / (d11 - d10);
                points.push({x: x + dx, y: y + t * dy});
            }
            if ((d01 < level && d11 >= level) || (d01 >= level && d11 < level)) {
                let t = (level - d01) / (d11 - d01);
                points.push({x: x + t * dx, y: y + dy});
            }
            if ((d00 < level && d01 >= level) || (d00 >= level && d01 < level)) {
                let t = (level - d00) / (d01 - d00);
                points.push({x: x, y: y + t * dy});
            }

            // Draw line segment if we have exactly 2 intersection points
            if (points.length === 2) {
                line(points[0].x, points[0].y, points[1].x, points[1].y);
            }
        }

        // ============= DISCRETE SIDE =============

        function initializeSequence() {
            sequence = [];
            targetSequence = [];
            insertionTimes = [];
            unmaskingTimes = [];

            for (let i = 0; i < N; i++) {
                // Sample insertion time T1 and unmasking time T2
                let t1 = random(0.1, 0.5);  // Insertion happens early
                let t2 = random(t1 + 0.1, 0.9); // Unmasking happens after insertion

                insertionTimes.push(t1);
                unmaskingTimes.push(t2);

                // Target token (1 to D)
                targetSequence.push(floor(random(1, D + 1)));

                // Start empty
                sequence.push(EMPTY);
            }
        }

        function drawDiscrete() {
            // Update sequence state based on current time
            for (let i = 0; i < N; i++) {
                if (t < insertionTimes[i]) {
                    sequence[i] = EMPTY;
                } else if (t < unmaskingTimes[i]) {
                    sequence[i] = MASK;
                } else {
                    sequence[i] = targetSequence[i];
                }
            }

            // Render as 8x8 grid
            let rightStart = width * 0.58;
            let rightWidth = width * 0.40;

            let cols = 8;
            let rows = 8;
            let cellSize = min(rightWidth / cols, height * 0.7 / rows);

            // Center the grid
            let gridWidth = cellSize * cols;
            let gridHeight = cellSize * rows;
            let xOffset = rightStart + (rightWidth - gridWidth) / 2;
            let yOffset = (height - gridHeight) / 2;

            push();
            translate(xOffset, yOffset);

            for (let i = 0; i < N; i++) {
                let col = i % cols;
                let row = floor(i / cols);
                let x = col * cellSize;
                let y = row * cellSize;

                // Cell color based on state
                let state = sequence[i];

                let isDark = document.body.classList.contains('dark-theme');
                noStroke();
                if (state === EMPTY) {
                    // Empty - draw subtle outline only
                    stroke(isDark ? 245 : 10, isDark ? 245 : 10, isDark ? 245 : 10, 30);
                    strokeWeight(1);
                    noFill();
                    rect(x, y, cellSize - 3, cellSize - 3, 2);
                } else if (state === MASK) {
                    // Mask - theme-aware grey
                    fill(isDark ? 220 : 40, isDark ? 220 : 40, isDark ? 225 : 45, 120);
                    rect(x, y, cellSize - 3, cellSize - 3, 2);
                } else {
                    // Revealed state - cooler color palette
                    noStroke();

                    // Different colors for each state (cool blues, teals, greys)
                    if (state === 1) {
                        fill(60, 80, 100, 180); // Dark blue-grey
                    } else if (state === 2) {
                        fill(70, 100, 120, 180); // Medium blue
                    } else if (state === 3) {
                        fill(80, 120, 140, 180); // Light blue
                    } else if (state === 4) {
                        fill(218, 83, 44, 180); // Accent (keep one for interest)
                    } else {
                        fill(50, 70, 80, 180); // Deep teal
                    }

                    rect(x, y, cellSize - 3, cellSize - 3, 2);
                }
            }

            pop();
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            setup();
        }
    </script>
</body>
</html>
