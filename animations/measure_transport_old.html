<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamical Measure Transport</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #fafafa;
            font-family: 'IBM Plex Mono', monospace;
        }
        #canvas-container {
            border: 2px solid #da532c;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <script>
        // Measure Transport: Flow ODE vs CTMC
        let flowParticles = [];
        let ctmcParticles = [];
        let frame_count = 0;
        let max_frames = 400;
        let t = 0;
        let canvasWidth = 800;
        let canvasHeight = 500;

        // Discrete states for CTMC (right side)
        let ctmcStates = [];
        let targetStates = [];

        function setup() {
            let canvas = createCanvas(canvasWidth, canvasHeight);
            canvas.parent(document.body);

            // LEFT SIDE: Continuous flow particles
            for (let i = 0; i < 60; i++) {
                let angle = random(TWO_PI);
                let r = randomGaussian(0, 30);
                flowParticles.push({
                    pos: createVector(200 + r * cos(angle), 350 + r * sin(angle) * 0.8),
                    target: random() < 0.5 ? 0 : 1  // Which mode to flow to
                });
            }

            // RIGHT SIDE: CTMC discrete states
            let n_states = 6;
            for (let i = 0; i < n_states; i++) {
                let angle = TWO_PI * i / n_states;
                let pos = createVector(
                    600 + 60 * cos(angle),
                    350 + 60 * sin(angle)
                );
                ctmcStates.push(pos);

                // Target configuration
                let targetPos;
                if (i < 3) {
                    targetPos = createVector(550, 150 + 40 * (i - 1));
                } else {
                    targetPos = createVector(650, 150 + 40 * (i - 3));
                }
                targetStates.push(targetPos);
            }

            // Initialize CTMC particles
            for (let state = 0; state < n_states; state++) {
                for (let j = 0; j < 10; j++) {
                    let offset = createVector(randomGaussian(0, 5), randomGaussian(0, 5));
                    ctmcParticles.push({
                        pos: p5.Vector.add(ctmcStates[state], offset),
                        state: state,
                        hasJumped: false
                    });
                }
            }
        }

        function draw() {
            background(250, 250, 250);

            // Update time
            t = frame_count / max_frames;

            // Draw divider
            stroke(100);
            strokeWeight(2);
            line(width / 2, 0, width / 2, height);

            // Draw labels
            drawLabels();

            // LEFT SIDE: Draw flow distributions
            drawFlowDistributions();

            // RIGHT SIDE: Draw CTMC states
            drawCTMCStates();

            // Update and draw flow particles (LEFT)
            updateFlowParticles();

            // Update and draw CTMC particles (RIGHT)
            updateCTMCParticles();

            // Draw equations
            drawEquations();

            // Increment frame
            frame_count++;
            if (frame_count >= max_frames) {
                frame_count = 0;
                // Reset CTMC particles
                for (let p of ctmcParticles) {
                    p.hasJumped = false;
                }
            }
        }

        function drawLabels() {
            fill(50);
            noStroke();
            textSize(18);
            textAlign(CENTER, TOP);

            fill(65, 105, 225);
            text('Probability Flow ODE', width / 4, 15);

            fill(255, 140, 0);
            text('CTMC (Jump Process)', 3 * width / 4, 15);

            // Time indicator
            textSize(16);
            fill(218, 83, 44);
            textAlign(LEFT, TOP);
            text(`t = ${t.toFixed(3)}`, 15, 45);
        }

        function drawFlowDistributions() {
            // Source distribution (bottom)
            noFill();
            stroke(65, 105, 225, 100);
            strokeWeight(2);
            ellipse(200, 350, 100, 120);

            // Target distributions (top) - ghosted
            fill(65, 105, 225, 20 + 40 * t);
            stroke(65, 105, 225, 100);
            ellipse(150, 150, 60);
            ellipse(250, 150, 60);
        }

        function drawCTMCStates() {
            // Source states
            noFill();
            stroke(255, 140, 0, 100);
            strokeWeight(2);

            for (let i = 0; i < ctmcStates.length; i++) {
                let pos = ctmcStates[i];
                ellipse(pos.x, pos.y, 25);
            }

            // Target states (ghosted)
            fill(255, 140, 0, 20 + 40 * t);
            stroke(255, 140, 0, 100);

            for (let i = 0; i < targetStates.length; i++) {
                let pos = targetStates[i];
                ellipse(pos.x, pos.y, 25);
            }
        }

        function updateFlowParticles() {
            for (let p of flowParticles) {
                // Determine target
                let target;
                if (p.target === 0) {
                    target = createVector(150, 150);
                } else {
                    target = createVector(250, 150);
                }

                // Velocity field (simple interpolation)
                let direction = p5.Vector.sub(target, p.pos);
                let speed = 0.02;
                p.pos.add(p5.Vector.mult(direction, speed));

                // Add slight noise
                p.pos.add(createVector(
                    randomGaussian(0, 0.5),
                    randomGaussian(0, 0.5)
                ));

                // Draw particle
                fill(65, 105, 225);
                noStroke();
                ellipse(p.pos.x, p.pos.y, 6);
            }
        }

        function updateCTMCParticles() {
            let jumpRate = 0.03;  // Base jump rate

            for (let p of ctmcParticles) {
                if (!p.hasJumped && random() < jumpRate * t) {
                    // Jump to target state
                    p.hasJumped = true;
                    let offset = createVector(randomGaussian(0, 5), randomGaussian(0, 5));
                    p.pos = p5.Vector.add(targetStates[p.state], offset);
                } else if (!p.hasJumped) {
                    // Small diffusion around current state
                    p.pos.add(createVector(
                        randomGaussian(0, 0.3),
                        randomGaussian(0, 0.3)
                    ));
                    // Keep near original state
                    let original = ctmcStates[p.state];
                    let diff = p5.Vector.sub(p.pos, original);
                    if (diff.mag() > 15) {
                        p.pos = p5.Vector.add(original, p5.Vector.mult(diff.normalize(), 15));
                    }
                }

                // Draw particle
                let particleColor = p.hasJumped ? color(218, 83, 44) : color(255, 140, 0);
                fill(particleColor);
                noStroke();
                ellipse(p.pos.x, p.pos.y, 6);
            }
        }

        function drawEquations() {
            textSize(14);
            textAlign(CENTER, TOP);

            // Flow ODE equation
            fill(50);
            text('dx/dt = v(x, t)', width / 4, height - 80);

            // CTMC equation
            text('P(X(t+dt) = j | X(t) = i) = q_ij dt', 3 * width / 4, height - 80);

            // Bottom note
            textSize(12);
            fill(100);
            text('Continuous paths transport probability smoothly', width / 4, height - 50);
            text('Discrete jumps transport probability stochastically', 3 * width / 4, height - 50);
        }
    </script>
</body>
</html>
